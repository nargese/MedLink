apiVersion: apps/v1
kind: Deployment
metadata:
  name: medlink
  namespace: medlink
spec:
  replicas: 1
  selector:
    matchLabels:
      app: medlink
  template:
    metadata:
      labels:
        app: medlink
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: docker.io/imenchi/medlink:git-5428f685bdbe1310077a39e05a302286062b9fd5
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: medlink-env
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: medlink
  namespace: medlink
spec:
  type: NodePort
  selector:
    app: medlink
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30082
