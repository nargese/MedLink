name: medlink

services:
  app:
    image: ${MEDLINK_IMAGE:-medlink:ci-3}
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${MEDLINK_BIND_IP:-127.0.0.1}:8082:3000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3